<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>cloud2api</title>
<link rel="icon" type="image/png" href="/files/assets/logo.png">
<link rel="stylesheet" href="/files/assets/app.css">
<link rel="stylesheet" href="/files/assets/files.css">
</head>
<body class="home">
<main class="home-shell">

  <div class="fx-brand">
    <div class="fx-mark"><img src="/files/assets/logo.png" alt="cloud2api logo" width="84" height="84" decoding="async"></div>
    <div>
      <div class="fx-brand-name">cloud2api</div>
      <div class="fx-brand-sub">网盘 · Agent 网关</div>
    </div>
  </div>

  <h1 class="home-title">选择入口</h1>
  <p class="home-sub">上传分享文件，或管理网盘与访问权限。</p>

  <div class="home-grid">
    <a class="card home-card" href="/files/">
      <div class="home-card-head">
        <span class="home-ico" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </span>
        <span class="home-card-name">文件空间</span>
      </div>
      <p class="home-card-desc">用实例签发的 API Key（sk-c2a-…）浏览、上传、下载和分享已授权网盘中的文件。</p>
      <span class="home-card-go">进入文件空间 →</span>
    </a>

    <a class="card home-card" href="/admin/">
      <div class="home-card-head">
        <span class="home-ico home-ico-admin" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V7z"/></svg>
        </span>
        <span class="home-card-name">管理门户</span>
      </div>
      <p class="home-card-desc">管理员密码登录：签发与配置 API Key、接入网盘、查看审计与系统状态。</p>
      <span class="home-card-go">进入管理门户 →</span>
    </a>
  </div>

</main>
</body>
</html>
